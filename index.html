    <script>
      // Set theme + motion before first paint to avoid flashes.
      (function () {
        try {
          var stored = localStorage.getItem('ap-theme');
          var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.classList.toggle('dark', theme === 'dark');
          var motion = localStorage.getItem('ap-motion');
          var reduced = motion ? motion === 'reduced' : window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          document.documentElement.dataset.motion = reduced ? 'reduced' : 'full';
        } catch (e) { /* no-op */ }
      })();
    </script>
